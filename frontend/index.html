<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'><rect width='48' height='48' rx='12' fill='%235B5BF0'/><g fill='white'><circle cx='24' cy='12.2' r='3'/><circle cx='30.8' cy='18.5' r='3'/><circle cx='30.8' cy='28.2' r='3'/><circle cx='24' cy='34.4' r='3'/><circle cx='17.2' cy='28.1' r='3'/><circle cx='17.2' cy='18.4' r='3'/></g></svg>" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#10262e" />
    <meta name="application-name" content="MediCloak" />
    <meta name="apple-mobile-web-app-title" content="MediCloak" />
    <title>MediCloak | 의료 AI 개인정보 보호</title>
    <script>
      // 저장된 테마를 그리기 전에 적용 (깜빡임 방지). 저장소를 못 쓰면 OS 설정을 따른다.
      try {
        var t = localStorage.getItem('zp-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
